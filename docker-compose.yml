services:
  app:
    build: .
    image: sgibnev-alexandr-devops
    container_name: sgibnev-alexandr-container
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STUDENT_NAME: ${STUDENT_NAME:-Alexandr}
      STUDENT_SURNAME: ${STUDENT_SURNAME:-Sgibnev}
      STUDENT_GROUP: ${STUDENT_GROUP:-IT2-2314}
      STUDENT_ID: ${STUDENT_ID:-37882}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
